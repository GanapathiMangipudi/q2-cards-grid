<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Q2 Product Cards Grid</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <section class="product-grid">

    <article class="product featured">
      <figure>
        <img src="assets/product-1.jpg" alt="Featured product image" />
        <figcaption>Featured Product</figcaption>
      </figure>
      <h2>New Balance</h2>
      <p>Our top recommended item with superior quality and design.</p>
      <a href="#" class="btn">View Details</a>
    </article>

    <article class="product">
      <figure>
        <img src="assets/product-2.jpg" alt="Product image 2" />
        <figcaption>Product 2</figcaption>
      </figure>
      <h3>Kookaburra</h3>
      <p>Short description for product 2.</p>
      <a href="#" class="btn">View Details</a>
    </article>

    <article class="product">
      <figure>
        <img src="assets/product-3.jpg" alt="Product image 3" />
        <figcaption>Product 3</figcaption>
      </figure>
      <h3>SG</h3>
      <p>Short description for product 3.</p>
      <a href="#" class="btn">View Details</a>
    </article>

    <article class="product">
      <figure>
        <img src="assets/product-4.jpg" alt="Product image 4" />
        <figcaption>Product 4</figcaption>
      </figure>
      <h3>GrayNicholls</h3>
      <p>Short description for product 4.</p>
      <a href="#" class="btn">View Details</a>
    </article>

  </section>
</body>
</html>
